name: 🚀 Release

on:
  # The release PR and the releases come from kidager-bot (GitHub App)
  release:
    types: [published]

permissions:
  # Uploads the JARs to the release
  contents: write
  # Cosign keyless signing and GitHub Pages deployment
  id-token: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Keycloak theme
        run: yarn build-keycloak-theme

      - name: Rename JAR files with version
        run: |
          cd dist_keycloak
          for f in keycloak-theme-*.jar; do
            new_name="${f/keycloak-theme/spinel-theme-$TAG}"
            mv "$f" "$new_name"
          done
          ls -la

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign JARs with Cosign
        run: |
          for jar in dist_keycloak/*.jar; do
            cosign sign-blob --yes \
              --bundle "${jar}.sigstore.json" \
              "$jar"
          done

      - name: Upload JARs and signatures to release
        run: gh release upload "$TAG" dist_keycloak/*.jar dist_keycloak/*.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-storybook:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Clean Storybook output
        run: rm -rf storybook-static

      - name: Build Storybook
        run: yarn build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
