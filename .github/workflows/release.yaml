name: 🚀 Release

on:
  # The release PR and the releases come from kidager-bot (GitHub App)
  release:
    types: [published]

permissions:
  # Uploads the JARs to the release
  contents: write
  # Cosign keyless signing and GitHub Pages deployment
  id-token: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build Keycloak theme
        run: yarn build-keycloak-theme

      - name: Rename JAR files with version
        run: |
          cd dist_keycloak
          for f in keycloak-theme-*.jar; do
            new_name="${f/keycloak-theme/spinel-theme-$TAG}"
            mv "$f" "$new_name"
          done
          ls -la

      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Sign JARs with Cosign
        run: |
          for jar in dist_keycloak/*.jar; do
            cosign sign-blob --yes \
              --bundle "${jar}.sigstore.json" \
              "$jar"
          done

      - name: Upload JARs and signatures to release
        run: gh release upload "$TAG" dist_keycloak/*.jar dist_keycloak/*.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}

  deploy-storybook:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Clean Storybook output
        run: rm -rf storybook-static

      - name: Build Storybook
        run: yarn build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
