name: 🧪 Test

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Clean Storybook output
        run: rm -rf storybook-static

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps chromium

      - name: Build Storybook
        run: yarn build-storybook

      - name: Run Playwright tests
        run: |
          # Plain static server: `serve` rewrites /iframe.html to the manager UI
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static &
          npx wait-on http://127.0.0.1:6006
          yarn test

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
